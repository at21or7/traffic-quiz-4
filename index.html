<style>
body{
  font-family: Arial, sans-serif;
  background:#eef2f5;
  margin:0;
  padding:10px;
}

h1{
  text-align:center;
  color:#003366;
  font-size:34px;
  line-height:1.4;
}

#container{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  border:2px solid #003366;
  padding:25px;
  box-sizing:border-box;
}

.question-no{
  font-size:40px;
  font-weight:bold;
  color:#003366;
}

.question-text{
  font-size:40px;
  line-height:1.7;
  font-weight:bold;
}

button{
  width:46%;
  padding:25px 0;
  font-size:72px;
  margin:20px 1%;
  cursor:pointer;
  border-radius:14px;
  border:2px solid #003366;
  background:#f8fbff;
}

.action-btn{
  width:100%;
  font-size:38px;
  padding:24px 10px;
  margin:18px 0 0;
  background:#003366;
  color:white;
}

.correct{
  color:green;
  font-weight:bold;
  font-size:36px;
}

.wrong{
  color:red;
  font-weight:bold;
  font-size:36px;
}

.review{
  margin-top:25px;
  border-top:2px solid #003366;
  padding-top:15px;
}

.review p{
  font-size:32px;
  line-height:1.8;
  margin-bottom:35px;
}

  color:red;
  font-weight:bold;
}

h2{
  font-size:48px;
}

h3{
  font-size:40px;
}

.result-score{
  font-size:42px;
  font-weight:bold;
}

.sub-title{
  text-align:center;
  color:#555;
  font-size:26px;
  line-height:1.5;
}

@media screen and (max-width:600px){
  h1{
    font-size:28px;
  }

  #container{
    padding:18px;
    margin:10px auto;
  }

  .question-no{
    font-size:34px;
  }

  .question-text{
    font-size:34px;
  }

  button{
    font-size:66px;
    padding:22px 0;
  }

  .action-btn{
    font-size:30px;
  }

  .review p{
    font-size:28px;
  }
}
</style>

<body>

<h1>村上中央自動車学校<br>学科問題（二輪車）</h1>

<p class="sub-title">
本免試験を想定した学科模擬テスト（全50問）
</p>

<div id="container"></div>

<script>
const container = document.getElementById("container");
const PASS_LINE = 47;
let current = 0;
let score = 0;
let wrongList = [];

const questions = [
{q:"二輪車のブレーキのかけ方には、ブレーキレバー、ブレーキペダル、エンジンブレーキの3種類がある。",a:true,e:"問題文の通りです。"},
{q:"二輪車でブレーキをかけるときは乾いた路面では前輪ブレーキ、ぬれた路面では後輪ブレーキをやや強めにかける。",a:true,e:"問題文の通りです。"},
{q:"二輪車でブレーキをかけるときは、車体を垂直に保ち、ハンドルを切らない状態で、エンジンブレーキ効かせながら前後輪のブレーキを同時にかけるようにする。",a:true,e:"問題文の通りです。"},
{q:"二輪車でカーブを通行するときは、カーブの途中でクラッチを切って惰力で走行するとよい。",a:false,e:"カーブ中はクラッチを切りません。二輪車でカーブを通行するときに、途中でクラッチを切って惰力走行をすると、車体が不安定になり危険です。カーブの手前で十分に減速し、カーブ中はクラッチをつないだ状態で一定の速度で通行します。"},
{q:"二輪車のブレーキには遊びがない方がよい。",a:false,e:"ブレーキレバーやブレーキペダルには適度な遊びが必要です。遊びがないとブレーキの引きずりや発熱、効きの低下につながるおそれがあります。"},
{q:"二輪車のエンジンブレーキは、スロットルの戻し、または、シフトダウン（低速ギアに入れること）がある。",a:true,e:"問題文の通りです。"},
{q:"二輪車でカーブを曲がるときは、車体を傾けると横滑りしやすいので、車体を傾けないようにしてハンドルを切るとよい。",a:false,e:"二輪車はカーブで車体を適度に傾けて曲がります。車体を傾けずにハンドルだけで曲がろうとすると不安定になり危険です。"},
{q:"二輪車を運転するときは、ステップに土踏まずを載せて、足先はブレーキを不用意に踏んでしまうことがないように、ブレーキペダルの下に位置するのがよい。",a:false,e:"足先はブレーキペダルの下ではなく、必要なときすぐ操作できる位置に置きます。"},
{q:"二輪車はぬかるみや砂利道などでは、ブレーキをかけないようにし、スロットルで速度を保ち、バランスをとりながら通過するのがよい。",a:true,e:"問題文の通りです。"},
{q:"二輪車でぬかるみや砂利道を通行するときは、タンクを両ひざではさみ、路面の状況によっては立ち姿勢をとりバランスを保ちながら走行するのがよい。",a:true,e:"問題文の通りです。"},
{q:"二輪車の正しい乗車姿勢は、ステップに土踏まずをのせ、足の裏が水平になるようにし、足先が前方を向くようにして、タンクを両ひざでしめるのがよい。",a:true,e:"問題文の通りです。"},
{q:"二輪車でカーブを通行するときは、カーブの途中では、スロットルで速度を加減することが大切である。",a:true,e:"問題文の通りです。"},
{q:"側車付きの自動二輪車は、エンジンを切って押して歩く場合は、歩行者として扱われる。",a:false,e:"エンジンをかけているものや側車付きのものは歩行者として扱われません。"},
{q:"二輪車でカーブを通行するときは、車体を傾けると自然に曲がるので、手前の直線部分であらかじめ速度を落とさなくてもよい。",a:false,e:"カーブの手前で十分に減速します。"},
{q:"二輪車は2台までけん引できる。",a:false,e:"けん引できるのは1台までです。"},
{q:"二輪車のチェーンはゆるみがあると危険なので、運行前には必ずいっぱいに張っておくのがよい。",a:false,e:"チェーンは張りすぎても危険です。適正なゆるみが必要です。"},
{q:"二輪車は体で安定を保ちながら走り、停止すれば安定を失うという構造上の特性をもっており、四輪車とは違った運転技術が必要である。",a:true,e:"問題文の通りです。"},
{q:"大型自動二輪か普通自動二輪を受けて1年を経過しない者は大型自動二輪車及び普通自動二輪車で二人乗りすることはできない。",a:true,e:"問題文の通りです。"},
{q:"二輪車を選ぶときは、平地でセンタースタンドを楽にたてられるかどうか確かめることも大切である。",a:true,e:"問題文の通りです。"},
{q:"二輪車を選ぶときは、またがってみて、片足が地面につき車体が支えられるかどうか、8の字に押して歩くことが完全にできるかどうかを確かめておくことが大切である。",a:false,e:"片足ではなく、両足のつま先が地面につくことが必要です。"},
{q:"原付は自賠責保険への加入が必要である。",a:true,e:"問題文の通りです。"},
{q:"大型二輪免許を受けていた期間が3年以上であれば、高速道路において二人乗りをすることができる。",a:true,e:"問題文の通りです。"},
{q:"オートマチック二輪車は、クラッチ操作がいらない分、スロットルを急に回転させると急発進する危険がある。",a:true,e:"問題文の通りです。"},
{q:"二輪車でブレーキをかけるときは、必ずクラッチを切ってからかけた方がよい。",a:false,e:"エンジンブレーキも使います。必ずクラッチを切ってからブレーキをかけるわけではありません。"},
{q:"原付の最大積載量は60kgである。",a:false,e:"原付の最大積載量は30kgまでです。"},
{q:"125cc以下の普通自動二輪車や原動機付自転車で、他の車をけん引するときの法定速度は30km/hである。",a:false,e:"25km/hです。"},
{q:"総排気量125ccの普通自動二輪車は高速道路を通行することができる。",a:false,e:"通行できません。"},
{q:"大型二輪免許で普通二輪を運転できる。",a:true,e:"問題文の通りです。"},
{q:"AT二輪車を運転するときは、ニーグリップができないので、足先をステップボードから外側に出してバランスをとるとよい。",a:false,e:"ステップボードから足先が外側に出ないようにし、足の裏全体を乗せ、足先をまっすぐ前に向けます。"},
{q:"二輪車は機動性に富んでいるので、交通が渋滞している時は、車の間をぬって走行することができる。",a:false,e:"車の間をぬって走行するなど、危険な走行をしてはいけません。"},
{q:"二輪車で四輪車の側方を通行しているときは、四輪車の死角に入り、四輪ドライバーに存在を気づかれていないことがあるので注意が必要である。",a:true,e:"問題文の通りです。"},
{q:"二輪車の車体は四輪車に比べて小さいため、実際の距離よりも遠くに感じる傾向がある。",a:true,e:"問題文の通りです。"},
{q:"四輪車の近くを二輪車で通行するときは、四輪車が二輪車に気づかないで行動を変えるかもしれないので、注意が必要である。",a:true,e:"問題文の通りです。"},
{q:"二輪車で走行中にエンジンの回転が上がった後、故障で下がらなくなったときは、点火スイッチを切ってエンジンの回転を止めることが大切です。",a:true,e:"問題文の通りです。"},
{q:"夜間二輪車に乗るときは、反射性の高い衣服または、反射材のついた乗車用ヘルメットを着用した方が良い。",a:true,e:"問題文の通りです。"},
{q:"大型自動二輪車とは、エンジンの総排気量が400ccを超える二輪の自動車のことである。",a:true,e:"問題文の通りです。"},
{q:"オートマチックの二輪車はエンジンブレーキがききやすいので、前後輪のブレーキを多用しないほうがよい。",a:false,e:"オートマチック二輪車のエンジンブレーキは弱めです。"},
{q:"二輪車を除く自動車の所有者などは、住所地などの本拠の位置から2キロメートル以内の道路以外の場所に、自動車の保管場所を確保しなければならない。",a:true,e:"問題文の通りです。"},
{q:"二輪車の乗車姿勢は、前かがみになるほど風圧を受けないようになるので、可能な限り前かがみになって運転すると安全である。",a:false,e:"前かがみになりすぎると視野が狭くなり危険です。"},
{q:"二輪車を運転する場合、ハンドルを軽く押すような気持ちでグリップを軽く握る。",a:true,e:"問題文の通りです。"},
{q:"二輪車を運転する場合、肩の力を抜き、ひじを外側にしぼるように軽く曲げる。",a:true,e:"問題文の通りです。"},
{q:"エンジンを止めた二輪車に乗って坂を下る場合は、歩行者扱いになるので歩道を通行できる。",a:false,e:"エンジンを止め、二輪車から降りて押して歩かなければ歩行者とはみなされません。"},
{q:"運転手の体格に合った二輪車とは、またがったときに両足のつま先が地面につく大きさである。",a:true,e:"問題文の通りです。"},
{q:"二輪車はエンジンを切り押して歩いても歩行者ではないので歩道を通行することはできない。",a:false,e:"エンジンを切り、押して歩いている場合は歩行者とみなされます。"},
{q:"二輪車に乗車時のヘルメットは、頭のサイズに合った規格品で、強度があり重くないものを選ぶとよい。",a:true,e:"問題文の通りです。"},
{q:"二輪車のブレーキのかけ方には、ブレーキレバーやブレーキペダルを使って前後輪ブレーキを効かせる方法のほかに、スロットルのもどし、またはシフトダウンによるエンジンブレーキがある。",a:true,e:"問題文の通りです。"},
{q:"オートマチック二輪車に無段変速装置が採用されている場合、エンジンの回転数が低いときには車輪にエンジンの力が伝わりにくくなる。",a:true,e:"問題文の通りです。"},
{q:"二輪車を運転するときは、PSCマークかJISマークのついた乗車用ヘルメットを着用しあごひもを確実にしめる。",a:true,e:"問題文の通りです。"},
{q:"二輪車は自賠責保険か責任共済が切れていても任意保険に加入していれば運転することができる。",a:false,e:"自賠責保険か責任共済が切れた状態で運転してはいけません。"},
{q:"二輪車で高速道路を二人乗りで運転してもよいのは、年齢が20歳以上で二輪免許を取得して3年以上経過した者である。",a:true,e:"問題文の通りです。"}
];

// 元の問題番号を保存
questions.forEach((q, i) => q.no = i + 1);

// 全50問の元データを保存
const questionsMaster = [...questions];

function showQuestion(){
  const q = questions[current];
  container.innerHTML = `
    <p class="question-no">【第 ${q.no} 問】</p>
    <p class="question-text">${q.q}</p>
    <button onclick="answer(true)">○</button>
    <button onclick="answer(false)">×</button>
  `;
}

function answer(val){
  const q = questions[current];

  if(val === q.a){
    score++;
  }else{
    wrongList.push({
      no: q.no,
      q: q.q,
      e: q.e
    });
  }

  current++;
  current < questions.length ? showQuestion() : showResult();
}

function showResult(){
  const isFullTest = questions.length === questionsMaster.length;
  const passLine = isFullTest ? PASS_LINE : questions.length;

  let html = `
    <h2>結果</h2>
    <p class="result-score">得点：${score} / ${questions.length}</p>
  `;

  html += score >= passLine
    ? `<p class="correct">合格</p>`
    : `<p class="wrong">不合格</p>`;

  if(wrongList.length){
    html += `<div class="review"><h3>間違えた問題の解説</h3>`;

    wrongList.forEach(w=>{
      html += `
        <p>
          <strong>【第 ${w.no} 問】</strong><br>
          ${w.q}<br><br>
          <span class="kaisetsu">解説：</span>${w.e}
        </p>
      `;
    });

    html += `</div>`;

    html += `
      <button class="action-btn" onclick="retryWrong()">
        間違えた問題だけもう一度テストする
      </button>
    `;
  }else{
    html += `<p class="correct">全問正解です！</p>`;
  }

  html += `
    <button class="action-btn" onclick="restartAll()">
      最初からやり直す
    </button>
  `;

  container.innerHTML = html;
}

function retryWrong(){
  const retryNumbers = wrongList.map(w => w.no);
  const retryQuestions = questionsMaster.filter(q => retryNumbers.includes(q.no));

  questions.length = 0;
  retryQuestions.forEach(q => questions.push(q));

  current = 0;
  score = 0;
  wrongList = [];

  showQuestion();
}

function restartAll(){
  questions.length = 0;
  questionsMaster.forEach(q => questions.push(q));

  current = 0;
  score = 0;
  wrongList = [];

  showQuestion();
}

showQuestion();
</script>

</body>
</html>
