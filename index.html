<style>

*{box-sizing:border-box}
body{font-family:Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:#eef2f5;color:#111;margin:0;padding:10px}
.site-header{text-align:center;max-width:900px;margin:18px auto 20px}
.site-header h1{font-size:34px;line-height:1.4;color:#003366;margin:0 0 16px}
.school-name,.quiz-title{display:block}
.quiz-subtitle{font-size:24px;line-height:1.6;color:#555;margin:0}
#container{max-width:900px;margin:20px auto;background:#fff;border:2px solid #003366;padding:25px}
#container .question-no{font-size:36px;line-height:1.5;font-weight:bold;color:#003366;margin:0 0 20px}
#container .question-text{font-size:40px;line-height:1.7;font-weight:bold;margin:0 0 24px;overflow-wrap:anywhere}
img.question-img{display:block;width:250px;max-width:100%;height:auto;margin:20px auto 24px;border:1px solid #ccc}
.answer-choices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.answer-choices button{width:100%;min-height:136px;padding:16px 0;font-family:inherit;font-size:64px;line-height:1.2;font-weight:bold;cursor:pointer;border:2px solid #003366;border-radius:14px;background:#f8fbff;color:#003366;margin:0;touch-action:manipulation}
.action-btn{font-family:inherit;cursor:pointer;border:2px solid #003366;background:#003366;color:#fff}
#container .quiz-progress{padding:16px;margin:0 0 24px;background:#f1f6fa;border-radius:12px}
#container .quiz-progress-label{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:16px;font-weight:bold;color:#003366;line-height:1.6;margin-bottom:10px}
#container .quiz-progress-label span{min-width:0}
#container .quiz-progress-label span:last-child{font-weight:normal;color:#526578;white-space:nowrap}
#container .quiz-progress progress{display:block;width:100%;height:10px;border:0;border-radius:10px;overflow:hidden;background:#dce6ef;accent-color:#003366}
#container .quiz-progress progress::-webkit-progress-bar{background:#dce6ef;border-radius:10px}
#container .quiz-progress progress::-webkit-progress-value{background:#003366;border-radius:10px}
#container .quiz-progress progress::-moz-progress-bar{background:#003366;border-radius:10px}
#container .menu-link{display:block;text-align:center;min-height:44px;margin:20px 0 8px;padding:12px;font-size:17px;line-height:1.6;color:#003366;text-underline-offset:4px}
/* 結果画面 */
#container:has(.result-summary){max-width:820px;border:1px solid #d7e2ec;border-radius:20px;padding:32px;box-shadow:0 8px 30px #0033660a;color:#24364a}
.result-summary{text-align:center;padding:8px 0 24px}
.result-summary h2{font-size:18px;color:#526578;margin:0 0 16px}
.result-status{display:inline-block;border-radius:30px;padding:8px 20px;font-size:18px;font-weight:bold;margin:0;background:#fff0ec;color:#a73521}
.result-status.passed{background:#e6f5ed;color:#17633e}
.result-summary .result-score{font-size:76px;color:#003366;line-height:1.15;margin:18px 0 12px;font-weight:bold}
.result-score small{font-size:24px;color:#65768a;font-weight:normal}
.result-meta{font-size:17px;line-height:1.8;margin:8px 0;color:#526578}
.result-message{font-size:18px;line-height:1.8;margin:16px 0 0}
.result-actions{display:grid;gap:12px;margin:8px 0 30px}
.result-actions .action-btn{width:100%;min-height:56px;font-size:18px;line-height:1.6;padding:14px 12px;margin:0;border-radius:12px;font-weight:bold}
.result-actions .secondary{background:#fff;color:#003366;border:1px solid #aabed0}
button:focus-visible,a:focus-visible{outline:3px solid #dd8500;outline-offset:4px}
.result-actions button:hover{filter:brightness(.95)}
.review{border-top:1px solid #d7e2ec;padding-top:24px;margin-top:0}
.review h3{font-size:22px;margin:0 0 18px;line-height:1.5;color:#003366}
.review h3 span{font-size:15px;color:#65768a;font-weight:normal;margin-left:8px}
.review-card{border:1px solid #d7e2ec;border-radius:14px;padding:22px;margin-bottom:16px;background:#fff}
.review-card h4{font-size:16px;color:#003366;margin:0 0 12px}
.review .review-card p{font-size:18px;line-height:1.85;margin:0 0 16px;overflow-wrap:anywhere}
.review-card .answer-label{display:inline-block;background:#edf4fb;color:#003366;font-size:16px;font-weight:bold;padding:6px 12px;border-radius:8px;margin-bottom:14px}
.review .review-card .explanation{background:#f3f7fa;border-radius:10px;padding:16px;margin:0}
.explanation strong{display:block;font-size:15px;color:#526578;margin-bottom:6px}
.school-link{display:block;text-align:center;color:#003366;font-size:16px;line-height:1.7;padding:16px 0;text-underline-offset:4px}
@media(max-width:600px){
#container:has(.result-summary){padding:22px 16px;border-radius:16px}
.result-summary .result-score{font-size:64px}
.result-score small{font-size:21px}
.result-meta{font-size:16px}
.result-message{font-size:17px}
.review h3{font-size:20px}
.review-card{padding:18px 16px}
.review .review-card p{font-size:17px}
.result-actions .action-btn{font-size:17px}
}


#container .result-status{font-size:18px;line-height:1.6}
#container .result-summary .result-score{font-size:76px;line-height:1.15}
#container .result-meta{font-size:17px;line-height:1.8}
#container .result-message{font-size:18px;line-height:1.8}
#container .review-card p{font-size:18px;line-height:1.85}
#container .review-card .answer-label{font-size:16px;line-height:1.6}
@media(max-width:600px){#container .result-summary .result-score{font-size:64px}#container .result-meta{font-size:16px}#container .result-message,#container .review-card p{font-size:17px}}


/* PCとスマホで、3種類すべて共通の表示設定 */
@media screen and (max-width:600px){
  body{padding:12px 8px}
  .site-header{margin:4px auto 12px}
  .site-header h1{font-size:22px;line-height:1.45;margin:0 0 8px}
  .site-header .school-name{font-size:16px;font-weight:600;margin-bottom:4px}
  .quiz-subtitle{font-size:14px;line-height:1.6;color:#526578}
  #container{padding:16px;margin:12px auto;border:1px solid #c8d9e8;border-radius:14px}
  #container .question-no{font-size:20px;line-height:1.5;margin:0 0 12px}
  #container .question-text{font-size:24px;line-height:1.65;font-weight:600;margin:0 0 16px}
  .question-screen img.question-img{width:200px;max-height:240px;object-fit:contain;margin:16px auto 20px}
  .answer-choices{gap:12px}
  .answer-choices button{min-height:80px;padding:8px 0;font-size:48px;line-height:1.25;border-radius:12px}
  #container .quiz-progress{padding:12px;margin:0 0 16px}
  #container .quiz-progress-label{font-size:14px;line-height:1.5;gap:4px 8px;margin-bottom:8px}
  #container .question-screen .menu-link{font-size:15px;line-height:1.6;margin:16px 0 0;padding:10px 4px}
}
@media screen and (max-width:360px){
  #container{padding:14px}
  #container .quiz-progress-label{font-size:13px}
  .question-screen img.question-img{width:180px}
}
</style>

<header class="site-header">

<script>
const container = document.getElementById("container");
const PASS_LINE = 47;
let current = 0;
let score = 0;
let wrongList = [];
let isRetryMode = false; // 誤答再テスト中かどうかを明示的に管理

const questions = [
{"q":"故障車をロープなどでけん引するときは、けん引する車と故障車との間に５メートルをこえる間隔を保たなければならない。","a":false,"e":"故障車をロープなどでけん引するときは、車両間の距離を5メートル以内にし、ロープなどの見やすい箇所に30センチメートル平方以上の白い布を付けなければなりません。"},
{"q":"乗り合いバス、タクシ－などの旅客自動車を旅客運送のために運転しようとする場合は、第二種免許が必要である。","a":true,"e":"問題文の通りです。"},
{"q":"進行方向別通行区分の標識がある交差点では、一般原動機付自転車は必ずその通行区分に従って右折しなければならない。","a":false,"e":"二段階右折が必要な交差点では、右折レーンに入らず、道路の左端に寄って二段階右折します。"},
{"q":"信号機のある交差点で、車両通行帯が3つ以上ある道路を右折する一般原動機付自転車は、原則として二段階右折をしなければならない。","a":true,"e":"信号機のある交差点で、進行方向の車両通行帯が3つ以上ある場合は、原則として二段階右折をします。ただし、二段階右折禁止の標識がある場合は、小回り右折をします。"},
{"q":"トンネル内では、車両通行帯が設けられている道路でも追い越しは禁止されている。","a":false,"e":"車両通行帯が設けられている道路のトンネルでは、トンネルであることを理由とする追い越し禁止規定は適用されません。"},
{"q":"交差点とその手前30メートル以内では、すべての道路で追い越しが禁止されている。","a":false,"e":"優先道路を通行している場合などは例外があります。"},
{"q":"横断歩道や自転車横断帯とその手前30メートル以内では、追い越しだけでなく、原則として追い抜きも禁止されている。","a":true,"e":"横断歩道や自転車横断帯とその手前30メートル以内では、原則として追い越し・追い抜きの両方が禁止されています。"},
{"q":"踏切内でマニュアル車のエンジンが停止し、再始動できなくなったときは、ギアをローまたはセカンドに入れ、クラッチペダルを踏まずにセルモーターを回して、車を踏切の外へ移動させる方法がある。","a":true,"e":"踏切内でエンストし、再始動できない場合、クラッチ・スタートシステムのないMT車では、ギアをローまたはセカンドに入れ、クラッチペダルを踏まずにセルモーターで脱出する方法があります。ただし、現在の多くのMT車やAT車では使用できません。脱出できない場合は、非常ボタンなどで列車に危険を知らせ、安全な場所へ避難します。"},
{"q":"踏切内では、エンストを防止するため、変速しないで、発進した時の低速ギア―のまま通過する。","a":true,"e":"踏切内でのエンストを防ぐため、途中で変速しないようにします。"},
{"q":"身体の不自由な人が通行しているときは、安全な間隔をあければ、徐行や一時停止をしなくてもよい。","a":false,"e":"身体の不自由な人などが通行しているときは、安全な間隔をあけるだけでなく、一時停止または徐行して、その通行を妨げないようにしなければなりません。"},
{"q":"つえを持った高齢者が通行しているときは、一時停止または徐行して、その通行を妨げないようにしなければならない。","a":true,"e":"つえを持った高齢者など、通行に支障のある人を保護するため、一時停止または徐行が必要です。"},
{"q":"白色または黄色のつえを持った人が通行しているときは、一時停止または徐行して、その通行を妨げないようにしなければならない。","a":true,"e":"白色または黄色のつえを持つ人は、視覚障害などがある場合があります。一時停止または徐行して安全を確保します。"},
{"q":"児童や幼児が一人で道路を通行しているときは、危険を避けるため、一時停止または徐行しなければならない。","a":true,"e":"保護者が付き添っていない児童や幼児の安全を守るため、一時停止または徐行が必要です。"},
{"q":"踏切に信号機が設置されている場合、青信号に従って通行するときは、一時停止せずに踏切を通過することができる。","a":true,"e":"信号機の表示に従って通行する場合は、踏切の直前で一時停止する必要はありません。ただし、安全確認は必要です。"},
{"q":"踏切に信号機が設置されている場合、青信号であれば踏切の左右の安全を確認せずに通過してもよい。","a":false,"e":"青信号であっても、列車の接近や踏切内の状況など、安全を確認する必要があります。"},
{"q":"自動車検査証の有効期間が満了していても、自賠責保険の有効期間内であれば、その自動車を運転してもよい。","a":false,"e":"車検が必要な自動車は、有効な車検証がなければ原則として運行できません。"},
{"q":"自賠責保険に加入していない自動車でも、車検の有効期間内であれば運転してもよい。","a":false,"e":"車検が有効でも、自賠責保険または自賠責共済が有効でなければ、原則として運行できません。"},
{"q":"一般原動機付自転車は、自動車検査証を備え付ける必要はないが、自賠責保険証明書は備え付けなければならない。","a":true,"e":"原付には車検制度がありませんが、自賠責保険への加入と証明書の備え付けが必要です。電子データによる備え付けも認められています。"},
{"q":"自動車検査証と自賠責保険証明書は、自宅で保管しておけば、車内に備え付ける必要はない。","a":false,"e":"車検証は車両に備え付け、自賠責保険証明書も運行時に備え付ける必要があります。自賠責保険証明書は、電子データによる備付けも認められています。"},
{"q":"自家用の普通乗用自動車は、新車で購入した場合、最初の自動車検査を3年後に受け、その後は2年ごとに受ける。","a":true,"e":"自家用乗用車の車検証の有効期間は、初回3年、2回目以降2年です。"},
{"q":"タクシーとして使用する乗用自動車は、初回の車検証の有効期間が1年である。","a":true,"e":"タクシーなどの事業用乗用自動車の自動車検査証の有効期間は、初回も2回目以降も1年です。"},
{"q":"自家用の普通乗用自動車は、年間の走行距離が少なければ、車検を3年ごとに受けてもよい。","a":false,"e":"2回目以降の有効期間は2年で、走行距離が少なくても延長されません。"},
{"q":"排気量400ccの自家用普通自動二輪車は、新車の場合、初回の自動車検査証の有効期間が3年である。","a":true,"e":"250ccを超える自家用二輪車は、初回3年、2回目以降2年です。"},
{"q":"車検に合格していても、自動車の使用者は必要な日常点検や定期点検整備を行わなければならない。","a":true,"e":"車検と点検整備は別の制度です。車検に合格しただけで、点検整備の義務がなくなるわけではありません。"},
{"q":"フロントガラスの内側が曇ったときは、エアコンを作動させ、デフロスターでガラスに風を送るとともに、外気導入にすると曇りを効果的に取り除くことができる。","a":true,"e":"エアコンの除湿機能を使用し、デフロスターでフロントガラスに風を送るとともに、外気導入にすることで、ガラスの内側の曇りを効果的に取り除くことができます。"},
{"q":"雨の日にフロントガラスの内側が曇ったときは、エアコンを作動させ、デフロスターを使用するよりも、内気循環にして送風する方が効果的である。","a":false,"e":"内気循環では車内の湿気がこもりやすくなります。エアコンを作動させ、デフロスターを使用する方が効果的です。"},
{"q":"制動距離は空走距離と停止距離を合わせたものである。","a":false,"e":"空走距離と制動距離を合わせたものを「停止距離」といいます。制動距離とは、ブレーキが効き始めてから車が完全に停止するまでに進む距離のことです。"},
{"q":"二輪車用ヘルメットを購入するときは、JISマークやPSCマークなど、安全性を確認できる表示のあるものを選ぶとよい。","a":true,"e":"JISマークは日本産業規格への適合を、PSCマークは国が定める製品安全基準への適合を示しています。ヘルメットは安全基準に適合し、頭の大きさに合ったものを選ぶことが大切です。"},
{"q":"進行方向別通行区分が指定されている道路では、交差点で進もうとする方向に応じて、指定された通行帯を通行しなければならない。","a":true,"e":"進行方向別通行区分が指定されている場合は、原則として、その指定に従って通行しなければなりません。ただし、二段階右折をする一般原動機付自転車などには例外があります。"},
{"q":"直進専用の通行帯を通行しているときは、交差点で安全を確認すれば、右折してもよい。","a":false,"e":"直進専用の通行帯から右折することはできません。右折するときは、あらかじめ右折できる通行帯を通行します。"},
{"q":"左折と直進の両方を示す矢印がある通行帯では、左折することも直進することもできる。","a":true,"e":"左折と直進の両方が指定されているため、いずれの方向にも進行できます。"},
{"q":"進行方向別通行区分は、道路標識だけでなく、路面に描かれた矢印によって指定されることもある。","a":true,"e":"進行方向別通行区分は、道路標識または道路標示によって指定されます。"},
{"q":"一般原動機付自転車が二段階右折をしなければならない交差点では、右折専用通行帯があっても、その通行帯に入って右折してはならない。","a":true,"e":"二段階右折を行う一般原動機付自転車は、原則として道路の左端に寄って交差点の向こう側まで進み、向きを変えて右折します。"},
{"q":"一般原動機付自転車が二段階右折をする交差点では、左端の通行帯に左折専用の矢印が表示されていても、二段階右折のために直進することができる。","a":true,"e":"二段階右折をする一般原動機付自転車には、進行方向別通行区分の指定が適用されないため、左折専用通行帯から直進して二段階右折を行います。"},
{"q":"交差点とその端から5メートル以内の場所では、人を乗り降りさせるための短時間の停車も原則として禁止されている。","a":true,"e":"交差点とその端から5メートル以内は駐停車禁止です。赤信号による停止などは例外です。"},
{"q":"バス停の標示柱から10メートル以内は、バスの運行時間外であっても必ず駐停車禁止となる。","a":false,"e":"バス停付近の駐停車禁止規制は、原則としてバスなどの運行時間中に適用されます。"},
{"q":"駐車禁止の標識がある場所では、人を乗り降りさせるための短時間の停止も禁止されている。","a":false,"e":"駐車禁止の標識がある場所でも、人を乗り降りさせるための停止は認められています。ただし、駐停車禁止の場所では、人の乗り降りのためであっても、原則として停車できません。"},
{"q":"運転者が車内にいても、客待ちのために継続して車を停止させることは駐車に当たる。","a":true,"e":"運転者が車内にいても、客待ちのために継続して車を停止させることは駐車に当たります。"},

{"q":"横断歩道を横断する歩行者がいないことが明らかな場合でも、必ず横断歩道の直前で停止できる速度に落とさなければならない。","a":false,"e":"横断する歩行者などがいないことが明らかな場合は、そのまま進むことができます。"},
{"q":"車は道路状態やほかの交通に関係なく道路の中央（中央線があるときは、その中央線）から右の部分にはみ出して通行することは禁止されている。","a":false,"e":""},

{"q":"追い越しとは進路を変更せずに前の車の横を通り、その車の前方に出ることを言う","a":false,"e":"追い越しとは、車が進路を変えて、進行中の前の車の側方を通り、その車の前方に出ることをいいます。一方、進路を変えずに前の車の側方を通って前方に出ることを、追い抜きといいます。"},
{"q":"車から離れるときは、オートマチック車はチェンジレバーを「P」に入れ、マニュアル車は平地や下り坂では「バック」、上り坂では「ロー」に入れておくとよい。","a":true,"e":"車から離れるときは、ハンドブレーキを確実にかけ、オートマチック車はチェンジレバーを「P」に入れます。マニュアル車は、平地や下り坂では「バック」、上り坂では「ロー」に入れておくと、車が動き出すのを防ぐのに効果的です。"}
];

// 元の問題番号を保存
questions.forEach((q, i) => q.no = i + 1);

// 全50問の元データを保存
const questionsMaster = [...questions];


function progressMarkup(){
  return `<div class="quiz-progress"><div class="quiz-progress-label"><span>${isRetryMode ? '再テスト' : 'テスト'}：現在${current + 1}問目／全${questions.length}問</span><span>回答済み ${current}問</span></div><progress value="${current}" max="${questions.length}" aria-label="回答済みの問題数">${current}／${questions.length}</progress></div>`;
}

function showQuestion(){
  if(current === 0) window.scrollTo(0, 0);
  const q = questions[current];
  const imgHtml = q.img ? `<img src="${q.img}" class="question-img" alt="第${q.no}問の標識・図">` : "";
  container.innerHTML = `<section class="question-screen">${progressMarkup()}
    <p class="question-no">【第 ${q.no} 問】</p>
    <p class="question-text">${q.q}</p>
    ${imgHtml}
    <div class="answer-choices">
      <button aria-label="○：正しい" onclick="answer(true)">○</button>
      <button aria-label="×：誤り" onclick="answer(false)">×</button>
    </div>
    <a class="menu-link" href="https://at21or7.github.io/">← 問題メニューに戻る</a>
  </section>`;
}

function answer(val){
  const q = questions[current];

  if(val === q.a){
    score++;
  }else{
    wrongList.push({
      no: q.no,
      q: q.q,
      e: q.e
    });
  }

  current++;
  current < questions.length ? showQuestion() : showResult();
}

function showResult(){
  const isFullTest = !isRetryMode && questions.length === questionsMaster.length;
  const passLine = isFullTest ? PASS_LINE : questions.length;

  // 50問を最後まで解答した場合のみ送信（誤答再テストは対象外）
  if (isFullTest && typeof gtag === "function") {
    gtag("event", "quiz_complete", {
      quiz_type: "motorcycle",
      score: score
    });
    if (score >= PASS_LINE) {
      gtag("event", "quiz_pass", {
        quiz_type: "motorcycle",
        score: score
      });
    }
  }

  const passed = score >= passLine;
  const rate = Math.round(score / questions.length * 100);
  const status = isFullTest ? (passed ? "合格" : "不合格") : (passed ? "復習クリア" : "もう一度復習しましょう");
  const message = wrongList.length
    ? `間違えた${wrongList.length}問を復習して、${isFullTest ? "合格" : "全問正解"}を目指しましょう。`
    : "全問正解です！よくできました。";
  const actions = `
    <div class="result-actions">
      ${wrongList.length ? `<button class="action-btn" onclick="retryWrong()">間違えた${wrongList.length}問を再テスト</button>` : ""}
      <button class="action-btn ${wrongList.length ? "secondary" : ""}" onclick="restartAll()">最初から50問に挑戦</button>
    </div>`;
  let html = `
    <section class="result-summary" aria-labelledby="result-title">
      <h2 id="result-title" tabindex="-1">${isFullTest ? "テスト結果" : "再テスト結果"}</h2>
      <p class="result-status ${passed ? "passed" : ""}">${status}</p>
      <p class="result-score">${score}<small> / ${questions.length}点</small></p>
      <p class="result-meta">${isFullTest ? `合格ライン ${PASS_LINE}点` : "再テストの目標：全問正解"}<br>正答率 ${rate}%${!passed ? `・${isFullTest ? "合格" : "全問正解"}まであと${passLine - score}点` : ""}</p>
      <p class="result-message">${message}</p>
    </section>
    ${actions}
  `;
  if(wrongList.length){
    html += `<section class="review"><h3>間違えた問題の解説 <span>${wrongList.length}問</span></h3>`;
    wrongList.forEach(w=>{
      const correctAnswer = questionsMaster.find(q => q.no === w.no).a;
      html += `
        <article class="review-card">
          <h4>第${w.no}問</h4>
          <p>${w.q}</p>
          <div class="answer-label">正解：${correctAnswer ? "○" : "×"}</div>
          <p class="explanation"><strong>解説</strong>${w.e}</p>
        </article>`;
    });
    html += `</section>${actions}`;
  }
  html += `<a class="menu-link" href="https://at21or7.github.io/">← 問題メニューに戻る</a><a class="school-link" href="https://murakami-ds.com/">村上中央自動車学校 公式サイトへ →</a>`;

  container.innerHTML = html;
  document.getElementById("result-title").focus();
  window.scrollTo(0, 0);
}

function retryWrong(){
  const retryNumbers = wrongList.map(w => w.no);
  const retryQuestions = questionsMaster.filter(q => retryNumbers.includes(q.no));

  questions.length = 0;
  retryQuestions.forEach(q => questions.push(q));

  current = 0;
  score = 0;
  wrongList = [];
  isRetryMode = true;

  showQuestion();
}

function restartAll(){
  questions.length = 0;
  questionsMaster.forEach(q => questions.push(q));

  current = 0;
  score = 0;
  wrongList = [];
  isRetryMode = false;

  showQuestion();
}

showQuestion();
</script>

</body>
</html>
