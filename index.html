.answer-choices button{width:100%;min-height:136px;padding:16px 0;font-family:inherit;font-size:64px;line-height:1.2;font-weight:bold;cursor:pointer;border:2px solid #003366;border-radius:14px;background:#f8fbff;color:#003366;margin:0;touch-action:manipulation}
.action-btn{font-family:inherit;cursor:pointer;border:2px solid #003366;background:#003366;color:#fff}

<script>
const container = document.getElementById("container");
const PASS_LINE = 47;
let current = 0;
let score = 0;
let wrongList = [];
let isRetryMode = false; // 誤答再テスト中かどうかを明示的に管理

const questions = [
{"q":"故障者をロープでけん引するときは、その間を５ｍ以内にしロープに０.３メートル平方以上の白い布をつけなければならない。","a":true,"e":"問題文の通りです。"},
{"q":"乗り合いバス、タクシ－などの旅客自動車を旅客運送のために運転しようとする場合は、第二種免許が必要である。","a":true,"e":"問題文の通りです。"},
{"q":"進行方向別通行区分の標識がある交差点では、一般原動機付自転車は必ずその通行区分に従って右折しなければならない。","a":false,"e":"二段階右折が必要な交差点では、右折レーンに入らず、道路の左端に寄って二段階右折します。"},
{"q":"信号機のある交差点で、車両通行帯が3つ以上ある道路を右折する一般原動機付自転車は、原則として二段階右折をしなければならない。","a":true,"e":"二段階右折が必要な場合は、右折レーンではなく道路の左端に寄って進行します。"},
{"q":"トンネル内では、車両通行帯が設けられている道路でも追い越しは禁止されている。","a":false,"e":"車両通行帯が設けられている道路のトンネルでは、トンネルであることを理由とする追い越し禁止規定は適用されません。"},
{"q":"交差点とその手前30メートル以内では、すべての道路で追い越しが禁止されている。","a":false,"e":"優先道路を通行している場合などは例外があります。"},
{"q":"横断歩道や自転車横断帯とその手前30メートル以内では、追い越しだけでなく、原則として追い抜きも禁止されている。","a":true,"e":"横断歩道とその手前30メートル以内では、原則として追い越し・追い抜きの両方が禁止されています。"},
{"q":"踏切内でマニュアル車のエンジンが停止し、再始動できなくなったときは、ギアをローまたはセカンドに入れ、クラッチペダルを踏まずにセルモーターを回して、車を踏切の外へ移動させる方法がある。","a":true,"e":"ギアをローまたはセカンドに入れ、クラッチをつながずにセルモーターの力で車を動かし、踏切から脱出する方法があります。（AT車やクラッチ・スタートシステムを装着したMT車ではこの方法は使えません。"},
{"q":"踏切内では、エンストを防止するため、変速しないで、発進した時の低速ギア―のまま通過する。","a":true,"e":"踏切内でのエンストを防ぐため、途中で変速しないようにします。"},
{"q":"身体の不自由な人が通行しているときは、安全な間隔をあければ、徐行や一時停止をしなくてもよい。","a":false,"e":"身体の不自由な人などが通行しているときは、安全な間隔をあけるだけでなく、一時停止または徐行して、その通行を妨げないようにしなければなりません。"},
{"q":"つえを持った高齢者が通行しているときは、一時停止または徐行して、その通行を妨げないようにしなければならない。","a":true,"e":"つえを持った高齢者など、通行に支障のある人を保護するため、一時停止または徐行が必要です。"},
{"q":"白色または黄色のつえを持った人が通行しているときは、一時停止または徐行して、その通行を妨げないようにしなければならない。","a":true,"e":"白色または黄色のつえを持つ人は、視覚障害などがある場合があります。一時停止または徐行して安全を確保します。"},
{"q":"児童や幼児が一人で道路を通行しているときは、危険を避けるため、一時停止または徐行しなければならない。","a":true,"e":"保護者が付き添っていない児童や幼児の安全を守るため、一時停止または徐行が必要です。。"},
{"q":"踏切に信号機が設置されている場合、青信号に従って通行するときは、一時停止せずに踏切を通過することができる。","a":true,"e":"信号機の表示に従って通行する場合は、踏切の直前で一時停止する必要はありません。ただし、安全確認は必要です。"},
{"q":"踏切に信号機が設置されている場合、青信号であれば踏切の左右の安全を確認せずに通過してもよい。","a":false,"e":"青信号であっても、列車の接近や踏切内の状況など、安全を確認する必要があります。"},
{"q":"自動車検査証の有効期間が満了していても、自賠責保険の有効期間内であれば、その自動車を運転してもよい。","a":false,"e":"車検が必要な自動車は、有効な車検証がなければ原則として運行できません。"},
{"q":"自賠責保険に加入していない自動車でも、車検の有効期間内であれば運転してもよい。","a":false,"e":"車検が有効でも、自賠責保険または自賠責共済が有効でなければ、原則として運行できません。"},
{"q":"一般原動機付自転車は、自動車検査証を備え付ける必要はないが、自賠責保険証明書は備え付けなければならない。","a":true,"e":"原付には車検制度がありませんが、自賠責保険への加入と証明書の備え付けが必要です。電子データによる備え付けも認められています。"},
{"q":"自動車検査証と自賠責保険証明書は、自宅で保管しておけば、車内に備え付ける必要はない。","a":false,"e":"車検証と自賠責保険証明書は車両に備え付ける必要があります。"},
{"q":"自家用の普通乗用自動車は、新車で購入した場合、最初の自動車検査を3年後に受け、その後は2年ごとに受ける。","a":true,"e":"自家用乗用車の車検証の有効期間は、初回3年、2回目以降2年です。"},
{"q":"タクシーとして使用する乗用自動車は、初回の車検証の有効期間が1年である。","a":true,"e":"タクシー（事業用自動車「６６０cc以下の自動車と大型自動二輪車、普通自動二輪車を除く」)の車検証の有効期間は、初回も2回目以降も1年です。"},
{"q":"自家用の普通乗用自動車は、年間の走行距離が少なければ、車検を3年ごとに受けてもよい。","a":false,"e":"2回目以降の有効期間は2年で、走行距離が少なくても延長されません。"},
{"q":"排気量400ccの自家用大型自動二輪車は、新車の場合、初回の車検証の有効期間が3年である。","a":true,"e":"250ccを超える自家用二輪車は、初回3年、2回目以降2年です。"},
{"q":"車検に合格していても、自動車の使用者は必要な日常点検や定期点検整備を行わなければならない。","a":true,"e":"車検と点検整備は別の制度です。車検に合格しただけで、点検整備の義務がなくなるわけではありません。"},
{"q":"フロントガラスの内側が曇ったときは、エアコンを作動させ、デフロスターでガラスに風を送るとともに、外気導入にすると曇りを効果的に取り除くことができる。","a":true,"e":"エアコンの除湿作用とデフロスターによる送風、外気導入を組み合わせることでを組み合わせることで、車内の湿気を減らし、曇りを取り除きやすくなります。（デフロスターはフロントガラスに風を当て、曇りを取り除くための装置です。)"},
{"q":"雨の日にフロントガラスの内側が曇ったときは、エアコンを作動させ、デフロスターを使用するよりも、内気循環にして送風する方が効果的である。","a":false,"e":"内気循環では車内の湿気がこもりやすくなります。エアコンを作動させ、デフロスターを使用する方が効果的です。"},
{"q":"フロントガラスの内側が曇ったときは、エアコンを作動させ、デフロスターでガラスに風を送るとともに、外気導入にすると曇りを効果的に取り除くことができる。","a":false,"e":"通行できません。"},
{"q":"二輪車用ヘルメットを購入するときは、JISマークやPSCマークなど、安全性を確認できる表示のあるものを選ぶとよい。","a":true,"e":"JISマークは日本産業規格への適合を、PSCマークは国が定める製品安全基準への適合を示しています。ヘルメットは安全基準に適合し、頭の大きさに合ったものを選ぶことが大切です。"},
{"q":"進行方向別通行区分が指定されている道路では、交差点で進もうとする方向に応じて、指定された通行帯を通行しなければならない。","a":true,"e":"進行方向別通行区分が指定されている場合は、その指定に従って通行しなければなりません。"},
{"q":"直進専用の通行帯を通行しているときは、交差点で安全を確認すれば、右折してもよい。","a":false,"e":"直進専用の通行帯から右折することはできません。右折するときは、あらかじめ右折できる通行帯を通行します。"},
{"q":"","a":true,"e":"問題文の通りです。"},

];

// 元の問題番号を保存
questions.forEach((q, i) => q.no = i + 1);

// 全50問の元データを保存
const questionsMaster = [...questions];


function progressMarkup(){
  return `<div class="quiz-progress"><div class="quiz-progress-label"><span>${isRetryMode ? '再テスト' : 'テスト'}：現在${current + 1}問目／全${questions.length}問</span><span>回答済み ${current}問</span></div><progress value="${current}" max="${questions.length}" aria-label="回答済みの問題数">${current}／${questions.length}</progress></div>`;
}

function showQuestion(){
  if(current === 0) window.scrollTo(0, 0);
  const q = questions[current];
  const imgHtml = q.img ? `<img src="${q.img}" class="question-img" alt="第${q.no}問の標識・図">` : "";
  container.innerHTML = `<section class="question-screen">${progressMarkup()}
    <p class="question-no">【第 ${q.no} 問】</p>
    <p class="question-text">${q.q}</p>
    ${imgHtml}
    <div class="answer-choices">
      <button aria-label="○：正しい" onclick="answer(true)">○</button>
      <button aria-label="×：誤り" onclick="answer(false)">×</button>
    </div>
    <a class="menu-link" href="https://at21or7.github.io/">← 問題メニューに戻る</a>
  </section>`;
}

function answer(val){
  const q = questions[current];

  if(val === q.a){
    score++;
  }else{
    wrongList.push({
      no: q.no,
      q: q.q,
      e: q.e
    });
  }

  current++;
  current < questions.length ? showQuestion() : showResult();
}

function showResult(){
  const isFullTest = !isRetryMode && questions.length === questionsMaster.length;
  const passLine = isFullTest ? PASS_LINE : questions.length;

  // 50問を最後まで解答した場合のみ送信（誤答再テストは対象外）
  if (isFullTest && typeof gtag === "function") {
    gtag("event", "quiz_complete", {
      quiz_type: "motorcycle",
      score: score
    });
    if (score >= PASS_LINE) {
      gtag("event", "quiz_pass", {
        quiz_type: "motorcycle",
        score: score
      });
    }
  }

  const passed = score >= passLine;
  const rate = Math.round(score / questions.length * 100);
  const status = isFullTest ? (passed ? "合格" : "不合格") : (passed ? "復習クリア" : "もう一度復習しましょう");
  const message = wrongList.length
    ? `間違えた${wrongList.length}問を復習して、${isFullTest ? "合格" : "全問正解"}を目指しましょう。`
    : "全問正解です！よくできました。";
  const actions = `
    <div class="result-actions">
      ${wrongList.length ? `<button class="action-btn" onclick="retryWrong()">間違えた${wrongList.length}問を再テスト</button>` : ""}
      <button class="action-btn ${wrongList.length ? "secondary" : ""}" onclick="restartAll()">最初から50問に挑戦</button>
    </div>`;
  let html = `
    <section class="result-summary" aria-labelledby="result-title">
      <h2 id="result-title" tabindex="-1">${isFullTest ? "テスト結果" : "再テスト結果"}</h2>
      <p class="result-status ${passed ? "passed" : ""}">${status}</p>
      <p class="result-score">${score}<small> / ${questions.length}点</small></p>
      <p class="result-meta">${isFullTest ? `合格ライン ${PASS_LINE}点` : "再テストの目標：全問正解"}<br>正答率 ${rate}%${!passed ? `・${isFullTest ? "合格" : "全問正解"}まであと${passLine - score}点` : ""}</p>
      <p class="result-message">${message}</p>
    </section>
    ${actions}
  `;
  if(wrongList.length){
    html += `<section class="review"><h3>間違えた問題の解説 <span>${wrongList.length}問</span></h3>`;
    wrongList.forEach(w=>{
      const correctAnswer = questionsMaster.find(q => q.no === w.no).a;
      html += `
        <article class="review-card">
          <h4>第${w.no}問</h4>
          <p>${w.q}</p>
          <div class="answer-label">正解：${correctAnswer ? "○" : "×"}</div>
          <p class="explanation"><strong>解説</strong>${w.e}</p>
        </article>`;
    });
    html += `</section>${actions}`;
  }
  html += `<a class="menu-link" href="https://at21or7.github.io/">← 問題メニューに戻る</a><a class="school-link" href="https://murakami-ds.com/">村上中央自動車学校 公式サイトへ →</a>`;

  container.innerHTML = html;
  document.getElementById("result-title").focus();
  window.scrollTo(0, 0);
}

function retryWrong(){
  const retryNumbers = wrongList.map(w => w.no);
  const retryQuestions = questionsMaster.filter(q => retryNumbers.includes(q.no));

  questions.length = 0;
  retryQuestions.forEach(q => questions.push(q));

  current = 0;
  score = 0;
  wrongList = [];
  isRetryMode = true;

  showQuestion();
}

function restartAll(){
  questions.length = 0;
  questionsMaster.forEach(q => questions.push(q));

  current = 0;
  score = 0;
  wrongList = [];
  isRetryMode = false;

  showQuestion();
}

showQuestion();
</script>

</body>
</html>
